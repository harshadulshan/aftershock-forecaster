<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"
 aria-label="Seven-day aftershock probabilities for the M6.5 Bonin Islands earthquake, counting the catalog from M2.5 versus from its completeness magnitude M4.2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Why catalog completeness matters</title><style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}</style>
<rect x="0.5" y="0.5" width="999" height="459" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect width="0" height="0"><animate id="t" attributeName="width" from="0" to="0" dur="12s" begin="0s;t.end"/></rect>
<text x="40" y="44" fill="#e6edf3" font-size="20" font-weight="600">M6.5 Bonin Islands: chance of ≥ 1 aftershock in the next 7 days</text>
<text x="40" y="68" fill="#8b949e" font-size="13">Same 4 aftershocks (M4.2–M5.3), two ways of counting them</text>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+0.10s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><rect x="40" y="92" width="14" height="14" rx="3" fill="#6e7681"/><text x="62" y="104" fill="#e6edf3" font-size="14">Counted from M2.5: 4 seen vs 445 expected → a = -3.49</text><rect x="40" y="118" width="14" height="14" rx="3" fill="#ff7b72"/><text x="62" y="130" fill="#e6edf3" font-size="14">Counted from M4.2 (completeness): 4 seen vs 12.6 expected → a = -2.13</text></g>
<text x="40" y="192" fill="#e6edf3" font-size="16" font-weight="600">M ≥ 3.5</text>
<rect x="150" y="170" width="700" height="44" rx="6" fill="#21262d"/>
<rect x="150" y="174" width="0" height="16" rx="4" fill="#6e7681"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="97.2" begin="t.begin+0.60s" dur="1.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="150" y="194" width="0" height="16" rx="4" fill="#ff7b72"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="655.7" begin="t.begin+2.20s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+1.50s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="864" y="187" fill="#8b949e" font-size="14">13.9%</text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+3.50s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="864" y="208" fill="#e6edf3" font-size="15" font-weight="700">93.7%</text></g>
<text x="40" y="262" fill="#e6edf3" font-size="16" font-weight="600">M ≥ 4.5</text>
<rect x="150" y="240" width="700" height="44" rx="6" fill="#21262d"/>
<rect x="150" y="244" width="0" height="16" rx="4" fill="#6e7681"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="12.9" begin="t.begin+0.95s" dur="1.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="150" y="264" width="0" height="16" rx="4" fill="#ff7b72"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="240.8" begin="t.begin+2.55s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+1.85s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="864" y="257" fill="#8b949e" font-size="14">1.8%</text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+3.85s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="864" y="278" fill="#e6edf3" font-size="15" font-weight="700">34.4%</text></g>
<text x="40" y="332" fill="#e6edf3" font-size="16" font-weight="600">M ≥ 5.5</text>
<rect x="150" y="310" width="700" height="44" rx="6" fill="#21262d"/>
<rect x="150" y="314" width="0" height="16" rx="4" fill="#6e7681"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="1.6" begin="t.begin+1.30s" dur="1.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="150" y="334" width="0" height="16" rx="4" fill="#ff7b72"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="36.6" begin="t.begin+2.90s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+2.20s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="864" y="327" fill="#8b949e" font-size="14">0.2%</text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+4.20s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="864" y="348" fill="#e6edf3" font-size="15" font-weight="700">5.2%</text></g>
<text x="40" y="402" fill="#e6edf3" font-size="16" font-weight="600">M ≥ 6.5</text>
<rect x="150" y="380" width="700" height="44" rx="6" fill="#21262d"/>
<rect x="150" y="384" width="0" height="16" rx="4" fill="#6e7681"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="0.2" begin="t.begin+1.65s" dur="1.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="150" y="404" width="0" height="16" rx="4" fill="#ff7b72"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="4.6" begin="t.begin+3.25s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+2.55s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="864" y="397" fill="#8b949e" font-size="14">0.0%</text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+4.55s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="864" y="418" fill="#e6edf3" font-size="15" font-weight="700">0.7%</text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><animate attributeName="opacity" from="0" to="1" begin="t.begin+5.40s" dur="0.6s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="t.begin+11.1s" dur="0.8s" fill="freeze"/><text x="40" y="446" fill="#ffa657" font-size="14">Counting below the catalog's completeness made the sequence look about 23x less productive than it is.</text></g>
</svg>